services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PYTHONPATH=/app/src
    command: python3 src/network/gateway.py
    volumes:
      - ./src:/app/src
      - ./data/delivery:/app/delivery
      - ./data/logs:/app/logs
      - ./data/backups:/app/backups
    restart: unless-stopped

  mcp:
    build: .
    ports:
      - "8081:8081"
    environment:
      - PYTHONPATH=/app/src
    command: python3 src/network/mcp_server.py
    volumes:
      - ./src:/app/src
      - ./data/delivery:/app/delivery
      - ./data/logs:/app/logs
    restart: unless-stopped

  model-api:
    build: .
    ports:
      - "8082:8082"
    environment:
      - PYTHONPATH=/app/src
    command: python3 -m nullstate.api.model_api
    volumes:
      - ./src:/app/src
      - ./data/logs:/app/logs
    restart: unless-stopped

  daemon:
    build: .
    environment:
      - PYTHONPATH=/app/src
    command: python3 src/system/daemon_loop.py
    volumes:
      - ./src:/app/src
      - ./data/delivery:/app/delivery
      - ./data/logs:/app/logs
      - ./data/backups:/app/backups
    restart: unless-stopped

  mail:
    build: .
    ports:
      - "2525:2525"
      - "8083:8083"
    environment:
      - PYTHONPATH=/app/src
    command: python3 src/extensions/mail/server.py
    volumes:
      - ./src:/app/src
      - ./data/logs:/app/logs
    restart: unless-stopped

  hub:
    build: .
    ports:
      - "8090:8090"
    environment:
      - PYTHONPATH=/app/src
    command: python3 src/extensions/mcp-hub/hub.py
    volumes:
      - ./src:/app/src
    restart: unless-stopped

volumes:
  delivery_data:
  log_data:
  backup_data:
