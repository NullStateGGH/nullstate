<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NullState Agent Verse</title>
<style>
:root { --neon: #00ff9d; --bg: #030303; --surface: #0a0a0a; --gold: #ffd700; --text: #e0e0e0; --red: #ff3355; --blue: #3399ff; --purple: #9966ff; --orange: #ff8833; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Fira Code', monospace; overflow: hidden; width: 100vw; height: 100vh; }
#container { position: relative; width: 100%; height: 100%; }
#verse { width: 100%; height: 100%; display: block; }
.tooltip { position: absolute; background: rgba(0,0,0,0.92); border: 1px solid var(--neon); border-radius: 8px; padding: 12px 16px; font-size: 11px; pointer-events: none; opacity: 0; transition: opacity 0.15s; max-width: 300px; z-index: 100; line-height: 1.6; }
.tooltip.visible { opacity: 1; }
.tooltip .name { color: var(--neon); font-weight: 700; font-size: 13px; }
.tooltip .stat { color: var(--gold); }
.tooltip .desc { color: #888; font-size: 10px; margin-top: 4px; }
#stats-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(3,3,3,0.95); border-top: 1px solid #1a1a1a; padding: 8px 20px; display: flex; gap: 24px; font-size: 11px; z-index: 50; }
#stats-bar .item { display: flex; align-items: center; gap: 6px; }
.pulse { animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
.flow-line { stroke-dasharray: 4; animation: flow 0.8s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -8; } }
.glow { filter: url(#glow); }
</style>
</head>

<div id="tooltip" class="tooltip"></div>

<div id="stats-bar">

</div>

<script>
(() => {
  const tooltip = document.getElementById('tooltip');
  const nodes = document.querySelectorAll('circle, rect, text');
  let hideTimer;

  // Interactive hover for key nodes
  const info = {
    'GATEWAY': { stat: 'v4 · HTTPS · 14 endpoints', desc: 'x402 + AP2 + KYA + MCP proxy + billing. Central commerce hub for all agent interactions.' },
    'MCP': { stat: '5 tools · 2 resources', desc: 'get_intelligence, submit_solution, get_ledger, get_tasks, execute_ap2_handshake' },
    'HOD': { stat: 'cycle 376 · $0.0107/min', desc: 'Autonomous self-management: revenue tracking, growth, self-healing, emergency mode.' },
    'Daemon': { stat: '376 cycles · 300s interval', desc: 'Orchestrates crawler → processor loop. Auto-adaptive scheduling based on queue depth.' },
    'SQLite': { stat: 'tasks: 1829 · ledger: 2002', desc: 'WAL mode + synchronous=NORMAL. Central data store replacing JSON files. Drives all services.' },
    'Ollama': { stat: 'nullstate:latest · 131k ctx', desc: '9.6GB model, ~13.5GB runtime RAM, gemma4:31b base. Primary inference engine for Model API + HOD.' },
    'Model': { stat: 'FastAPI · :8082', desc: 'Per-token pricing $0.0005/1K. Free tier 1000 tok/day. OpenAI-compatible /v1/chat/completions.' },
    'Broker': { stat: 'BROKEN — foreign project', desc: 'Points to /opt/nullstate_workspace/active_agents. Unrecoverable from this workspace.' },
    'Mail': { stat: ':2525 SMTP · :8083 API', desc: '5 accounts at greensol.me. Outbound relay queue with 5 retries. Proxied via gateway /mail/*.' },
    'Hub': { stat: ':8090 · 2 discovered', desc: 'MCP Hub auto-discovers servers from Smithery/awesome-mcp/registries, wraps with x402/AP2/KYA payment.' },
    'GH': { stat: ':8091 · active', desc: 'GitHub App webhook receiver. Handles workflow_job, PR merge, bounty issues, check_runs. HMAC-SHA256 verified.' },
    'Chr': { stat: 'Manifest V3', desc: 'Chrome extension intercepts Gemini API calls, injects KYA token. Pay-per-tab agent billing.' },
    'HF': { stat: 'Gradio Space', desc: 'Hugging Face Space with Status, KYA, Submit Solution, HF Inference (pay-per-call 0.001 USDC) tabs.' },
  };

  document.querySelectorAll('text').forEach(el => {
    const key = el.textContent.trim();
    if (info[key] && el.closest('svg')) {
      el.style.cursor = 'pointer';
      el.addEventListener('mouseenter', (e) => {
        clearTimeout(hideTimer);
        const rect = el.getBoundingClientRect();
        const data = info[key];
        tooltip.innerHTML = `<div class="name">${key}</div><div class="stat">${data.stat}</div><div class="desc">${data.desc}</div>`;
        tooltip.style.left = Math.min(rect.left + 20, window.innerWidth - 320) + 'px';
        tooltip.style.top = Math.max(rect.top - 80, 10) + 'px';
        tooltip.classList.add('visible');
      });
      el.addEventListener('mouseleave', () => {
        hideTimer = setTimeout(() => tooltip.classList.remove('visible'), 200);
      });
    }
  });

  // Live-updating stats
  async function refreshStats() {
    try {
      const resp = await fetch('/health');
      const data = await resp.json();
      if (data.tasks) {
        document.getElementById('db-tasks').textContent = data.tasks.total || '?';
        document.getElementById('db-ledger').textContent = data.ledger?.entries || '?';
      }
      if (data.ledger?.balance) {
        document.getElementById('rev-balance').textContent = '$' + data.ledger.balance.toFixed(2);
      }
    } catch(e) {}
  }

  // Refresh every 30s if in VSCode (skip fetch errors)
  // setInterval(refreshStats, 30000);

  // Timestamp
  document.getElementById('live-ts').textContent = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

  console.log('[NullState Verse] Agent ecosystem visualization loaded.');
})();
</script>
</body>
</html>
